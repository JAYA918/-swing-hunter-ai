name: Update Swing Hunter Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1-5"
    - cron: "30 12 * * 1-5"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python scanner.py

      - name: Publish latest scan
        run: |
          git config user.name "Swing Hunter Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || (git commit -m "Update daily scan" && git push)

          
